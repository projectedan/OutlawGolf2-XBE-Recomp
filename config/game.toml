# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# Some course textures have headers embedded in their owning allocation.
[[hook]]
at = 0x257AAE
call = "SkipEmbeddedTextureFree"
on_true = 0x257AB4

# Keep the engine's 1/30-second simulation step and draw between updates.
[[hook]]
at = 0x8E727
call = "UseElapsedTime"
after = true

[[hook]]
at = 0x1BA270
call = "DrawBetweenSimulationTicks"
on_true = 0x1BA374

[[hook]]
at = 0x1BA253
call = "UpdateFrameTiming"

[[hook]]
at = 0x1BA385
call = "DrawDuringFastForward"
after = true

[[hook]]
at = 0x1BA3EA
call = "PaceWithoutSwap"

[[hook]]
at = 0x4D31F
call = "UsePreviewDrawTime"

[[hook]]
at = 0x4CC71
call = "WrapTrajectoryTexture"
after = true

# 60 game ticks: the camera apply's smoothing factors, converted per apply and put back after
[[hook]]
at = 0x18BB80
call = "BeginCameraApply"

[[hook]]
at = 0x18C2E7
call = "EndCameraApply"

# 60 game ticks: the course intro's orbit around the flag turns by half its per-tick angle
[[hook]]
at = 0x1A157A
call = "HalveIntroOrbitStep"

# 60 game ticks: the aiming camera's tilt keeps the 1/30 step it was tuned for
[[hook]]
at = 0x40D17
call = "GrassBufferSize"

[[hook]]
at = 0x40D2E
call = "GrassBufferSizeKept"

[[hook]]
at = 0x3FBAE
call = "GrassCapInEsi"

[[hook]]
at = 0x3FF7E
call = "GrassCapInEsi"

[[hook]]
at = 0x4035E
call = "GrassCapInEsi"

[[hook]]
at = 0x4072E
call = "GrassCapInEsi"

[[hook]]
at = 0x3FF4A
call = "GrassRoomLeft"
on_true = 0x3FC70

[[hook]]
at = 0x4032D
call = "GrassRoomLeft"
on_true = 0x40040

[[hook]]
at = 0x406FA
call = "GrassRoomLeft"
on_true = 0x40420

[[hook]]
at = 0x40ADD
call = "GrassRoomLeft"
on_true = 0x407F0

[[hook]]
at = 0x4116E
call = "ScaleGrassDistance"

[[hook]]
at = 0x5861F
call = "KeepAimTiltAt30"

[[hook]]
at = 0x58651
call = "KeepAimTiltAt30"

# 60 game ticks: the golf cart's physics sub-steps keep the console's size and rate
[[hook]]
at = 0x321B6
call = "CartSubStepSize"

[[hook]]
at = 0x322EC
call = "CartSubStepCount"

# 60 game ticks: the camera circling the cart at the end of its minigame turns by the step, not a fixed angle
[[hook]]
at = 0x6125B
call = "ScaleCartOrbitStep"

# 60 game ticks: the beating minigame's prompt sweeps by the step, not a fixed amount a tick
[[hook]]
at = 0xCB9BD
call = "ScaleBeatSweepDown"

[[hook]]
at = 0xCB9D9
call = "ScaleBeatSweepUp"
